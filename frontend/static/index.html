<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #ccfbf1;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --user-bubble: #0d9488;
    --radius-lg: 16px;
    --radius-md: 12px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
    color: #fff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 10px rgba(15, 118, 110, 0.2);
    z-index: 10;
  }
  .header-title { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.15rem; }
  .header-status { display: flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 500; opacity: 0.95; background: rgba(255,255,255,0.15); padding: .25rem .6rem; border-radius: 20px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; box-shadow: 0 0 8px #4ade80; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.2rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  /* Welcome Banner */
  .welcome-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    text-align: center;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.4s ease-out;
  }
  .welcome-banner h2 { margin: 0 0 .5rem 0; color: var(--accent-dark); font-size: 1.25rem; }
  .welcome-banner p { margin: 0; color: var(--text-muted); font-size: .92rem; line-height: 1.5; }

  /* Dialogue Message Rows */
  .msg-row {
    display: flex;
    gap: .75rem;
    max-width: 88%;
    animation: slideUp 0.3s ease-out;
  }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .avatar.agent { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
  .avatar.user { background: #e2e8f0; color: #475569; }

  .bubble-wrapper {
    display: flex;
    flex-direction: column;
    gap: .25rem;
    max-width: 100%;
  }
  .sender-name { font-size: .75rem; font-weight: 600; color: var(--text-muted); margin-left: .2rem; }
  .msg-row.user .sender-name { text-align: right; margin-right: .2rem; }

  .bubble {
    padding: .75rem 1.05rem;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-size: .95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.agent .bubble { border-top-left-radius: 4px; }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
  }

  /* Rich A2UI Card Wrapper */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    white-space: normal;
    width: 100%;
  }

  /* Animated Typing Indicator */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: .7rem 1rem;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: 0s; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Bottom Panel & Prompt Chips */
  .bottom-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.03);
  }

  .prompt-chips {
    display: flex;
    gap: .6rem;
    padding: .75rem 1.2rem .25rem;
    max-width: 820px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompt-chips::-webkit-scrollbar { display: none; }
  .chip-btn {
    padding: .45rem .9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-main);
    font-size: .85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .chip-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
  }

  form {
    display: flex;
    gap: .75rem;
    padding: .85rem 1.2rem 1.1rem;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  input {
    flex: 1;
    padding: .75rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: .95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: var(--bg);
  }
  input:focus {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  }
  button[type="submit"] {
    padding: .75rem 1.3rem;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent-dark), var(--accent));
    color: #fff;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: .4rem;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.25);
  }
  button[type="submit"]:hover {
    opacity: 0.95;
    transform: translateY(-1px);
  }

  /* A2UI Component Enhancements */
  .a2card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.1rem;
    background: #fff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: .6rem; }
  .a2col { display: flex; flex-direction: column; gap: .5rem; }
  .a2row { display: flex; flex-direction: row; gap: .7rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent-dark); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: .95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: .85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: .6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: var(--radius-md); display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<header>
  <div class="header-title">
    <span>✈️</span> Travel Concierge Agent
  </div>
  <div class="header-status">
    <span class="status-dot"></span> Ready
  </div>
</header>

<div id="log">
  <div class="welcome-banner" id="welcomeBanner">
    <h2>Welcome to Travel Concierge 🌍</h2>
    <p>I can help you build personalized itineraries, discover destination spots, calculate budget breakdowns, and generate scenic visuals. Select an example prompt below or type your request!</p>
  </div>
</div>

<div class="bottom-panel">
  <div class="prompt-chips">
    <button class="chip-btn" type="button" onclick="sendPrompt('Plan a 3-day itinerary for Tokyo with budget breakdown')">📍 3-Day Tokyo Itinerary</button>
    <button class="chip-btn" type="button" onclick="sendPrompt('Find top travel destination spots in Paris')">🗼 Top Spots in Paris</button>
    <button class="chip-btn" type="button" onclick="sendPrompt('Generate a scenic preview image of Amalfi Coast')">🌊 Amalfi Coast Image</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Where would you like to travel? Ask something…" autocomplete="off" autofocus>
    <button type="submit">
      <span>Send</span>
      <span style="font-size:1.1rem; line-height:1;">➤</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const welcomeBanner = document.getElementById("welcomeBanner");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  if (welcomeBanner && welcomeBanner.parentNode) {
    welcomeBanner.style.display = "none";
  }

  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar " + who, who === "user" ? "👤" : "✈️");
  
  const wrapper = el("div", "bubble-wrapper");
  const sender = el("div", "sender-name", who === "user" ? "You" : "Travel Concierge");
  const b = el("div", "bubble");

  wrapper.appendChild(sender);
  wrapper.appendChild(b);

  row.appendChild(avatar);
  row.appendChild(wrapper);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() {
  if (welcomeBanner && welcomeBanner.parentNode) {
    welcomeBanner.style.display = "none";
  }
  const row = el("div", "msg-row agent");
  row.id = "typingRow";
  const avatar = el("div", "avatar agent", "✈️");
  const wrapper = el("div", "bubble-wrapper");
  const sender = el("div", "sender-name", "Travel Concierge");
  const b = el("div", "bubble");
  
  const dots = el("div", "typing-indicator");
  dots.appendChild(el("span", "typing-dot"));
  dots.appendChild(el("span", "typing-dot"));
  dots.appendChild(el("span", "typing-dot"));
  b.appendChild(dots);

  wrapper.appendChild(sender);
  wrapper.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(wrapper);

  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function removeTypingIndicator() {
  const tr = document.getElementById("typingRow");
  if (tr) tr.remove();
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  bubble("user").textContent = text;
  input.value = "";

  showTypingIndicator();

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    removeTypingIndicator();

    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    const b = bubble("agent");
    renderReply(b, data.parts || []);
  } catch (e) {
    removeTypingIndicator();
    const b = bubble("agent");
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
